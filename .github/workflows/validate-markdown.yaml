name: validate-markdown

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/validate_markdown_links.py"
      - "scripts/validate_compatibility_dates.py"
      - "scripts/validate_reserved_metadata_keys.py"
      - "scripts/regenerate_proposals_impl_tracking.py"
      - "scripts/regenerate_impl_dependencies.py"
      - "scripts/_impl_manifest.py"
      - ".github/workflows/validate-markdown.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/validate_markdown_links.py"
      - "scripts/validate_compatibility_dates.py"
      - "scripts/validate_reserved_metadata_keys.py"
      - "scripts/regenerate_proposals_impl_tracking.py"
      - "scripts/regenerate_impl_dependencies.py"
      - "scripts/_impl_manifest.py"
      - ".github/workflows/validate-markdown.yaml"
  # Weekly run on main. The push/PR triggers above only fire on spec-repo
  # changes, but both generated artifacts (the proposals impl-tracking columns
  # and the compatibility implementation-support block) regenerate from the
  # live openarmature-python conformance.toml, so a python push can drift them
  # with no spec-repo commit, leaving main green-but-stale until an unrelated
  # PR trips --check. This scheduled run surfaces that drift proactively.
  schedule:
    - cron: "0 12 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_markdown_links.py
      # The mechanical checks run first and the date check last. A step
      # failure stops the job, and drift in a generated artifact is resolved by
      # re-running a script, while a missing reserved key is closed by adding
      # the name §3.4's own maintenance rule already requires. A date
      # contradiction needs a human edit. Reporting the mechanical failures
      # first keeps an author from fixing dates, pushing, and only then
      # learning something else had drifted underneath them.
      - name: Check proposals impl-tracking columns are current
        run: python scripts/regenerate_proposals_impl_tracking.py --check
      - name: Check compatibility implementation-support block is current
        run: python scripts/regenerate_impl_dependencies.py --check
      - name: Check every OA-emitted metadata key is reserved
        run: python scripts/validate_reserved_metadata_keys.py
      - name: Check compatibility page dates do not contradict each other
        run: python scripts/validate_compatibility_dates.py
