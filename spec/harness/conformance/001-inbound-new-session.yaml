# Harness conformance fixture suite — per-directory harness contract:
#
#   - The adapter instantiates a reference harness with a synthetic
#     in-process transport. The transport accepts synthetic transmissions
#     (each carrying a `payload` mapping; optionally a dispatch_intent
#     hint, a session_id, a signal_payload) and delivers them to the
#     harness's inbound entrypoint.
#   - Top-level YAML shape extends the conformance-adapter §4 schema with
#     a `harness:` block (mode + signal_coordinator config) and a
#     `transmissions:` list (each entry exercises one inbound).
#   - Per-transmission expected assertions:
#     * `dispatch_path`, `error_bucket` and `error_category` are the harness
#       turn outcomes defined in conformance-adapter §5.8.
#     * `invoke_outcome` (completed|errored|suspended): the outcome of the
#       transmission's invoke() call.
#     * `invocation_id`: the invocation id of the transmission's invoke()
#       outcome, usually a binding token that later transmissions share.
#     * `invoke_args`: the arguments the harness passed on its invoke() call
#       for the transmission, matched by named keys over argument names
#       (conformance-adapter §8.4). `invoke_args_absent_keys` lists
#       arguments that MUST be absent from that call.
#     * `outbound_shape`: the class of outbound the harness emitted to the
#       synthetic transport: `completion_response`, `error_response` or
#       `suspended_acknowledgment`.
#     * `outbound_payload_includes`: the outbound's payload, matched by named
#       keys over the synthetic transport's payload keys: `value`,
#       `category`, `bucket` and `diagnostic_message`. harness §7 leaves an
#       outbound's shape to each transport, and this note fixes the shape
#       for the synthetic transport.
#     * `resolved_to_invocation_id`: the invocation id the signal coordinator
#       resolved the arrival to, usually a binding token.
#   - Input placeholder: `<from <transmission> suspended outcome>`, written in
#     a transmission's input, is replaced before the transmission is sent by
#     the invocation id of the named earlier transmission's suspended outcome.
#   - Binding tokens (conformance-adapter §5.10): `<invocation_id_X>`, for an
#     id a later transmission refers back to.
#   - Stateless-mode harnesses use dispatch_path 3.0 exclusively.
#
# §3.1 New-session inbound path: a synthetic transmission with no
# session_id; the harness assigns a fresh session_id and invokes with
# it threaded.

cases:
  - name: harness_assigns_fresh_session_id_on_new_session
    description: |
      Sessioned-mode harness receives a synthetic transmission with no
      session_id in the payload. The harness classifies as path §3.1
      (new-session), assigns a fresh session_id, constructs initial
      state, and calls invoke(initial_state, session_id=<fresh_id>).
      The fresh id is auto-generated by the harness; the engine treats
      it as the new session's identifier and saves at completion.
    harness:
      mode: sessioned
    state:
      fields:
        message_count:
          type: int
          default: 0
    entry: increment
    nodes:
      increment:
        update: {message_count: 1}
    edges:
      - {from: increment, to: END}
    session_store: in_memory
    transmissions:
      - name: tx_no_session_id
        payload: {kind: "new_session_start"}
        dispatch_intent: new_session
        expected:
          dispatch_path: "3.1"
          invoke_args:
            session_id: "<any-string>"   # harness minted, not caller-supplied
          invoke_outcome: completed
          final_state: {message_count: 1}
    invariants:
      harness_classified_as_new_session_path: true
      harness_auto_generated_session_id: true
      engine_received_session_id: true
