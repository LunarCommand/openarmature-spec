# Content blocks — text-only equivalence. A user message constructed with a
# single TextBlock is normatively equivalent to the same user message
# constructed with content as a string (§3.1.1). On the OpenAI wire the
# string maps to a string and the block sequence to the content-array
# form (§8.1.1).

mock_provider:
  responses:
    - status: 200
      body:
        id: chatcmpl-test-009-a
        object: chat.completion
        created: 1700000000
        model: test-model
        choices:
          - index: 0
            message: {role: assistant, content: "ack"}
            finish_reason: stop
        usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    - status: 200
      body:
        id: chatcmpl-test-009-b
        object: chat.completion
        created: 1700000000
        model: test-model
        choices:
          - index: 0
            message: {role: assistant, content: "ack"}
            finish_reason: stop
        usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}

calls:
  # Call 1: content as a string (the v1 form).
  - operation: complete
    messages:
      - {role: user, content: "hello"}
    expected_wire_request:
      model: test-model
      messages:
        - {role: "user", content: "hello"}
    expected:
      response:
        message: {role: assistant, content: "ack", tool_calls: null}
        finish_reason: stop

  # Call 2: content as a single-element content-block sequence with one
  # TextBlock. Per §3.1.1, normatively equivalent to call 1.
  #
  # §8.1.1 maps a content-block sequence to OpenAI's content-array form,
  # so the wire carries the array, and the exact expected_wire_request
  # below accepts only that form.
  - operation: complete
    messages:
      - role: user
        content:
          - {type: text, text: "hello"}
    expected_wire_request:
      model: test-model
      messages:
        - role: "user"
          content:
            - {type: "text", text: "hello"}
    expected:
      response:
        message: {role: assistant, content: "ack", tool_calls: null}
        finish_reason: stop
