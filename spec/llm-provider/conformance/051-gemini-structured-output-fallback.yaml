# §8.3.5.1 Gemini structured-output fallback (prompt augmentation).
# For a model without native responseJsonSchema support, the mapping
# falls back to prompt augmentation (per §8.1.5.1's pattern): it appends
# a schema directive to systemInstruction or the message list and parses
# the text response. The wire request carries NO responseJsonSchema /
# responseMimeType.
#
# The directive's text is implementation-derived and its placement is
# left open, so neither systemInstruction nor contents is asserted. The
# wire assertion names the members the spec fixes and asserts the native
# fields absent under generationConfig.

mapping: gemini

mock_provider:
  capabilities:
    supports_native_structured_output: false
  responses:
    - status: 200
      body:
        candidates:
          - content:
              role: model
              parts:
                - {text: '{"value":42}'}
            finishReason: STOP
        usageMetadata: {promptTokenCount: 18, candidatesTokenCount: 4, totalTokenCount: 22}

calls:
  - operation: complete
    messages: [{role: user, content: "Generate."}]
    response_schema:
      type: object
      properties:
        value: {type: integer}
      required: [value]
      additionalProperties: false
    config: {max_tokens: 64}
    expected_wire_request_includes:
      model: gemini-test
      generationConfig:
        maxOutputTokens: 64
      # No native structured-output fields on the fallback path.
      generationConfig_absent_keys: [responseMimeType, responseJsonSchema]
    expected:
      response:
        parsed: {value: 42}
