# Smallest possible OTel trace: linear graph with three nodes, default observer
# config. Establishes the fundamental shape before testing nuances in 002-011.
#
# Conformance harness contract for observability fixtures:
#
#   - The harness instantiates an in-memory OTel SpanExporter and a private
#     TracerProvider for openarmature spans (per spec §6 TracerProvider
#     isolation). For fixture 010, the harness also installs an in-memory
#     LogRecordExporter wired through the OTel Logs Bridge.
#   - Graph definition follows the pipeline-utilities/graph-engine fixture
#     conventions (state, entry, nodes, edges, initial_state).
#   - Optional config blocks:
#     * `caller_correlation_id` — string passed to invoke(); when omitted, the
#       framework auto-generates a UUIDv4 (spec §3.1).
#     * `detached_subgraphs` / `detached_fan_outs` — sets of subgraph/fan-out
#       names to configure as detached (spec §4.4).
#     * `disable_llm_spans` — bool, opts out of §5.5 LLM provider span
#       emission.
#     * `mock_llm` — canned responses for an OpenAI-compatible mock provider
#       (per llm-provider §8 wire format).
#     * `caller_global_otel_active` — bool. When true, the harness installs a
#       SECOND exporter on the OTel global TracerProvider to verify that
#       openarmature spans do NOT leak into it (fixture 005 isolation case).
#     * `langfuse_client` — {mode: credentials | supplied, provider?}. Constructs
#       the Langfuse observer's client for provider-isolation cases (proposal
#       0115): credentials = the impl builds it from credentials; supplied = the
#       harness builds it (on `provider`, default global) and hands it in. Uses
#       the provider-faithful Langfuse fake (conformance-adapter §6.4); payload
#       flags via the existing `langfuse_observer` block + the OTel §5.5.4 default.
#       Proposal 0116 adds sub-keys `preexisting_same_key_client` (bool — prime a
#       same-credential client before the impl constructs, defeating isolation via
#       the SDK singleton) and `accept_shared_provider` (bool — the single caller
#       opt-out).
#     * `adapter_capabilities` — {langfuse_bound_provider_detection: bool}, declared
#       by the adapter (proposal 0116): whether its SDK surface lets it establish the
#       Langfuse client's bound provider. Non-portable, so per-adapter.
#     * `requires_capability` — {langfuse_bound_provider_detection: bool}, per case
#       (proposal 0116): the case is asserted only against adapters whose declaration
#       matches (raise cases require detection; the suppress case requires its
#       absence; a case without it applies to all).
#   - Expected output:
#     * `expected_construction_error` — {category}, a TOP-LEVEL case key (sibling of
#       `expected:`, like `expected_compile_error`; proposal 0116, fixture 158):
#       asserts observer/client construction (or first use) raised the categorized
#       error. NOT nested under `expected:`.
#     * `expected.no_payload_bearing_langfuse_observations_on_global` /
#       `expected.payload_bearing_langfuse_observations_on_global` — for fixture 158,
#       payload-scoped variants of the leak assertions (the §6.4 fake distinguishes a
#       payload-bearing observation from a payload-free one).
#     * `expected.log_records[].level` — asserts the log record's OTel severity (e.g.
#       WARNING); proposal 0116, fixture 158.
#     * `expected.span_tree` — hierarchical span structure with name,
#       attributes (subset assertions), status, optional links, and children.
#     * `expected.log_records` — for fixture 010, list of expected log
#       records with attribute assertions.
#     * `expected.no_openarmature_spans_on_global` — for fixture 005, asserts
#       openarmature didn't emit through the global provider.
#     * `expected.no_langfuse_observations_on_global` — for fixture 157, asserts
#       no Langfuse observation leaked to the global provider.
#     * `expected.no_langfuse_observations_on_private` — for fixture 157, asserts
#       no Langfuse observation leaked to openarmature's own private OTel
#       provider (the other forbidden shared-provider spelling).
#     * `expected.langfuse_observations_on_global` — for fixture 157, asserts a
#       Langfuse observation DID reach the global provider (mode-a non-mutation).
#
# Attribute placeholder strings:
#   - `<uuid>` matches any canonical UUIDv4 (36 chars, hyphenated).
#   - `<any-string>` matches any non-empty string.
#   - `<trace_id_X>` matches an opaque trace_id used for parent-link
#     correlation across the fixture's spans (the harness binds X to the
#     actual trace_id on first occurrence and asserts equality on later
#     occurrences).

state:
  fields:
    v:
      type: int
      default: 0
    trace:
      type: list<string>
      reducer: append
      default: []

entry: a

nodes:
  a:
    update: {v: 1, trace: ["a"]}
  b:
    update: {v: 2, trace: ["b"]}
  c:
    update: {v: 3, trace: ["c"]}

edges:
  - {from: a, to: b}
  - {from: b, to: c}
  - {from: c, to: END}

initial_state: {}

# No caller_correlation_id — verify auto-generation.

expected:
  span_tree:
    - name: "openarmature.invocation"
      attributes:
        openarmature.invocation_id: "<uuid>"
        openarmature.correlation_id: "<uuid>"
        openarmature.graph.entry_node: "a"
        openarmature.graph.spec_version: "<any-string>"
      status: OK
      children:
        - name: "a"
          attributes:
            openarmature.node.name: "a"
            openarmature.node.namespace: ["a"]
            openarmature.node.step: 0
            openarmature.node.attempt_index: 0
            openarmature.correlation_id: "<uuid>"
          status: OK
          children: []
        - name: "b"
          attributes:
            openarmature.node.name: "b"
            openarmature.node.namespace: ["b"]
            openarmature.node.step: 1
            openarmature.node.attempt_index: 0
            openarmature.correlation_id: "<uuid>"
          status: OK
          children: []
        - name: "c"
          attributes:
            openarmature.node.name: "c"
            openarmature.node.namespace: ["c"]
            openarmature.node.step: 2
            openarmature.node.attempt_index: 0
            openarmature.correlation_id: "<uuid>"
          status: OK
          children: []

  # All four spans (invocation + a + b + c) MUST share the same
  # correlation_id value (the framework's auto-generated UUIDv4).
  invariants:
    correlation_id_consistency: true
