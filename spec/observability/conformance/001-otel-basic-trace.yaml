# Smallest possible OTel trace: linear graph with three nodes, default observer
# config. Establishes the fundamental shape before testing nuances in 002-011.
#
# Conformance harness contract for observability fixtures:
#
#   - The harness instantiates an in-memory OTel SpanExporter and a private
#     TracerProvider for openarmature spans (per spec §6 TracerProvider
#     isolation). For a case that asserts `log_records`, the harness also
#     captures log records through an in-memory LogRecordExporter wired
#     through the OTel Logs Bridge (conformance-adapter §6.3).
#   - Graph definition follows the pipeline-utilities/graph-engine fixture
#     conventions (state, entry, nodes, edges, initial_state).
#   - Default bound model: a `calls_llm` that names no `model`, and every
#     `calls_llm_from_wrapper` call, is bound to `test-model`. A case that
#     asserts another request model MUST name it on `calls_llm`.
#   - Streaming inputs, for the streaming fixtures (111, 113 to 118 and
#     161; 112 checks the path without them). They are harness stand-ins for
#     wire streaming: the spec tests the assembled content against the
#     concatenated deltas, not wire-incremental delivery (llm-provider §5).
#     * `calls_llm.stream: <bool>`: when true, the node calls complete() with
#       `stream` set, so the provider emits per-chunk LlmTokenEvents
#       (graph-engine §6). False or absent keeps the atomic path, which
#       emits no token events.
#     * `mock_llm_stream: [[<chunk>, ...], ...]`: replaces `mock_llm` for
#       streamed calls. It holds one entry per complete() call, in the order
#       the calls are made; each entry is the ordered list of SSE chunks the
#       mock provider yields for that call. A chunk has the OpenAI
#       streamed-chunk shape, {choices: [{index, delta: {content: "..."} |
#       {reasoning_content: "..."} | {reasoning: "..."} | {tool_calls:
#       [{index, id?, function: {name?, arguments?}}]}, finish_reason:
#       <reason|null>}]}, and the terminal usage chunk carries empty choices
#       and {usage: {prompt_tokens, completion_tokens, total_tokens}}. A chunk
#       entry MAY instead be the mid-stream failure marker {error: {status:
#       <int>}}, defined in fixture 114's header. A call under call-level
#       retry wraps its entry in `wire_attempts:`, one chunk list per wire
#       attempt, defined in fixture 116's header. llm-provider §8.1.6 pins the
#       real SSE source, which llm-provider fixture 059 exercises.
#   - Optional config blocks:
#     * `caller_correlation_id` — string passed to invoke(); when omitted, the
#       framework auto-generates a UUIDv4 (spec §3.1).
#     * `detached_subgraphs` / `detached_fan_outs` — sets of subgraph/fan-out
#       names to configure as detached (spec §4.4).
#     * `disable_llm_spans` — bool, opts out of §5.5 LLM provider span
#       emission.
#     * `mock_llm` — canned responses for an OpenAI-compatible mock provider
#       (per llm-provider §8 wire format).
#     * `caller_global_otel_active` — bool. When true, the harness installs a
#       SECOND exporter on the OTel global TracerProvider to verify that
#       openarmature spans do NOT leak into it (fixture 005 isolation case).
#     * `langfuse_client` — {mode: credentials | supplied, provider?}. Constructs
#       the Langfuse observer's client for provider-isolation cases (proposal
#       0115): credentials = the impl builds it from credentials; supplied = the
#       harness builds it (on `provider`, default global) and hands it in. Uses
#       the provider-faithful Langfuse fake (conformance-adapter §6.4); payload
#       flags via the `langfuse_observer` block for the Langfuse side and the
#       `otel_observer` block for the OTel side (conformance-adapter §5.5); each
#       flag omitted keeps its observability §5.5.4 default.
#       Proposal 0116 adds sub-keys `preexisting_same_key_client` (bool — prime a
#       same-credential client before the impl constructs, defeating isolation via
#       the SDK singleton) and `accept_shared_provider` (bool — the single caller
#       opt-out).
#     * `adapter_capabilities` / `requires_capability`: the capability gates,
#       defined in conformance-adapter §5.17. The adapter declares its
#       capabilities and a case states the ones it requires. §5.17 defines
#       `langfuse_bound_provider_detection` (fixture 158),
#       `llm_strict_native_schema` and `llm_prompt_augmentation_fallback`
#       (fixture 161). Fixture 022's header defines
#       `langfuse_token_budget_warning_level`.
#   - Expected output:
#     * `expected_construction_error` — {category}, a TOP-LEVEL case key (sibling of
#       `expected:`, like `expected_compile_error`; proposal 0116, fixture 158):
#       asserts observer/client construction (or first use) raised the categorized
#       error. NOT nested under `expected:`.
#     * `expected.no_payload_bearing_langfuse_observations_on_global` /
#       `expected.payload_bearing_langfuse_observations_on_global` — for fixture 158,
#       payload-scoped variants of the leak assertions (the §6.4 fake distinguishes a
#       payload-bearing observation from a payload-free one).
#     * `expected.span_tree` and `expected.traces`: defined in
#       conformance-adapter §5.8.
#     * `expected.span_tree_private` / `expected.span_tree_global`: a
#       `span_tree` over openarmature's private exporter, or over the exporter
#       the harness installs on the global TracerProvider when
#       `caller_global_otel_active` is set. A span whose parent is on the
#       other provider is a root.
#     * `expected.detached_trace_count`: the number of OTel traces, other than
#       the invocation's own, that hold spans from the call.
#     * `expected.invocation_id`: the `openarmature.invocation_id` attribute of
#       the call's invocation span.
#     * `expected.response_usage`: the usage record of the case's single
#       `complete()` response, matched by the keys it names
#       (conformance-adapter §8.4). It asserts the case made exactly one call.
#     * `expected.direct_call_result`: `{value, type, exception}` for a
#       `direct_call:` made outside any invocation. `value` is exact.
#       `type: immutable_mapping` classifies the returned mapping as one the
#       caller cannot mutate. `exception: null` asserts nothing was raised.
#     * `expected.determinism_check`: `{compare_runs, ignore_attributes,
#       compare, require_equal}`. With `require_equal: true`, the
#       private-exporter spans of the two runs that `compare_runs` names are
#       equal in each facet `compare` lists, with sibling spans compared
#       unordered. Attributes that `ignore_attributes` lists are left out,
#       and a trailing `*` in an entry matches any suffix.
#     * `expected.per_invocation`: a container that scopes each inner block to
#       the named invocation of the case. Its inner keys are named claims,
#       which an adapter implements as conformance-adapter §5.9 requires.
#     * `expected.log_records`: defined in conformance-adapter §5.5.
#     * `expected.no_openarmature_spans_on_global` — for fixture 005, asserts
#       openarmature didn't emit through the global provider.
#     * `expected.no_langfuse_observations_on_global` — for fixture 157, asserts
#       no Langfuse observation leaked to the global provider.
#     * `expected.no_langfuse_observations_on_private` — for fixture 157, asserts
#       no Langfuse observation leaked to openarmature's own private OTel
#       provider (the other forbidden shared-provider spelling).
#     * `expected.langfuse_observations_on_global` — for fixture 157, asserts a
#       Langfuse observation DID reach the global provider (mode-a non-mutation).
#     * `expected.langfuse_trace` / `expected.langfuse_traces` and their
#       observation entries: defined in fixture 022's header.
#
# Attribute placeholder strings (conformance-adapter §5.10):
#   - `<uuid>` matches any canonical UUIDv4 (36 chars, hyphenated).
#   - `<any-string>` matches any non-empty string.
#   - A binding token `<name_X>` matches any present, non-null value, and
#     every occurrence of the same token in a case must hold the same value.
#     Two different tokens may hold equal values. This suite's tokens are
#     listed in conformance-adapter §5.10, among them:
#     * `<trace_id_X>`: an opaque trace_id, used for parent-link correlation
#       across the fixture's spans and traces.
#     * `<path_X>` (fixture 161): a call's `structured_output_path`, which its
#       typed event and its span's path attribute must share.

state:
  fields:
    v:
      type: int
      default: 0
    trace:
      type: list<string>
      reducer: append
      default: []

entry: a

nodes:
  a:
    update: {v: 1, trace: ["a"]}
  b:
    update: {v: 2, trace: ["b"]}
  c:
    update: {v: 3, trace: ["c"]}

edges:
  - {from: a, to: b}
  - {from: b, to: c}
  - {from: c, to: END}

initial_state: {}

# No caller_correlation_id — verify auto-generation.

expected:
  span_tree:
    - name: "openarmature.invocation"
      attributes:
        openarmature.invocation_id: "<uuid>"
        openarmature.correlation_id: "<uuid>"
        openarmature.graph.entry_node: "a"
        openarmature.graph.spec_version: "<any-string>"
      status: OK
      children:
        - name: "a"
          attributes:
            openarmature.node.name: "a"
            openarmature.node.namespace: ["a"]
            openarmature.node.step: 0
            openarmature.node.attempt_index: 0
            openarmature.correlation_id: "<uuid>"
          status: OK
          children: []
        - name: "b"
          attributes:
            openarmature.node.name: "b"
            openarmature.node.namespace: ["b"]
            openarmature.node.step: 1
            openarmature.node.attempt_index: 0
            openarmature.correlation_id: "<uuid>"
          status: OK
          children: []
        - name: "c"
          attributes:
            openarmature.node.name: "c"
            openarmature.node.namespace: ["c"]
            openarmature.node.step: 2
            openarmature.node.attempt_index: 0
            openarmature.correlation_id: "<uuid>"
          status: OK
          children: []

  # All four spans (invocation + a + b + c) MUST share the same
  # correlation_id value (the framework's auto-generated UUIDv4).
  invariants:
    correlation_id_consistency: true
