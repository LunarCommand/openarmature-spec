# Smallest possible Langfuse trace: linear graph with three nodes,
# default Langfuse observer config. Establishes the fundamental Trace +
# Observation shape before testing nuances in 023-024.
#
# Conformance harness contract for Langfuse-mapping fixtures:
#
#   - The harness instantiates an in-memory Langfuse client recorder
#     (captures Trace + Observation entities as they would be sent to
#     Langfuse) and a Langfuse observer wired to the graph. The recorder
#     replaces the network sink; no real Langfuse API call is made.
#   - Graph definition follows the existing observability fixture
#     conventions (state, entry, nodes, edges, initial_state, mock_llm).
#   - Optional config blocks:
#     * `caller_correlation_id` — string passed to invoke(); when omitted,
#       framework auto-generates a UUIDv4 (spec §3.1).
#     * `caller_invocation_label` — string passed to invoke() as the
#       caller-supplied invocation label per §8.6; when omitted, the
#       observer SHOULD default trace.name to the entry-node name.
#     * `langfuse_observer` — block configuring the Langfuse observer:
#       * `disable_llm_spans: bool` (default false)
#       * `disable_provider_payload: bool` (default true)
#     * `mock_llm` — canned responses for an OpenAI-compatible mock
#       provider (per llm-provider §8 wire format).
#   - Capability, gated with `requires_capability` (conformance-adapter
#     §5.17):
#     * `langfuse_token_budget_warning_level`: on a token-budget exceedance
#       the implementation sets the Langfuse generation's level to `WARNING`
#       with a `statusMessage` (observability §5.5.15 and §8.4.3, a SHOULD).
#   - Expected output:
#     * `expected.langfuse_trace`: the one Langfuse Trace the call produced,
#       read from the conformance-adapter §6.4 recorder. A case that
#       produces more than one Trace uses `langfuse_traces`. The mapping
#       asserts the Trace fields it names (conformance-adapter §8.4), and
#       `input` and `output` are exact. `metadata` matches by the keys it
#       names, with `metadata_absent` for keys that must be absent.
#       `observations` lists the top-level observations, complete and
#       unordered. Trace-field absence is written
#       `langfuse_trace_absent_keys`, beside `langfuse_trace`.
#     * `expected.langfuse_traces`: every Trace in the block's scope, the
#       invocation's own and each detached one. The list is complete and
#       unordered, and each entry matches as `langfuse_trace` does.
#     * Observation entries, in `observations` and `children`: `type`
#       (`span`, `generation`, `event`, `embedding`, `retriever`, `tool`),
#       `name`, `level`, `statusMessage`, `input`, `output`, `model`,
#       `usage` (with `usage_absent_keys`), `usageDetails` (with
#       `usageDetails_absent_keys`), `modelParameters`, `metadata`,
#       `metadata_absent`, `metadata_truncation`, `input_parses_as_messages`,
#       `prompt_entity_link`, `children` and `absent_keys`. An entry asserts
#       the keys it names. `children` lists every child observation,
#       complete and unordered. `metadata_absent` and `metadata_truncation`
#       are as conformance-adapter §5.5 defines them.
#       `input_parses_as_messages` parses a string `input` as JSON; the
#       message list is complete and ordered, and each message matches by
#       the keys it names.
#     * Unset fields (conformance-adapter §8.4): on a Trace or an
#       observation, an unset top-level field reads as Langfuse's default.
#       That is null for `input`, `output`, `statusMessage`, `userId` and
#       `sessionId`, and `DEFAULT` for `level`. A mapping held in a field,
#       such as `metadata` or `usage`, is a JSON document, where `null` and
#       a missing key differ.
#
# Attribute placeholder strings (same as OTel fixtures):
#   - `<uuid>` matches any canonical UUIDv4 (36 chars, hyphenated).
#   - `<any-string>` matches any non-empty string.
#   - `<corr_id_X>` is a binding token for an opaque correlation id shared
#     across observations. It matches any present, non-null value, and
#     every occurrence of the same token in a case holds the same value
#     (conformance-adapter §5.10).

state:
  fields:
    v:
      type: int
      default: 0
    trace:
      type: list<string>
      reducer: append
      default: []

entry: a

nodes:
  a:
    update: {v: 1, trace: ["a"]}
  b:
    update: {v: 2, trace: ["b"]}
  c:
    update: {v: 3, trace: ["c"]}

edges:
  - {from: a, to: b}
  - {from: b, to: c}
  - {from: c, to: END}

initial_state: {}

# No caller_correlation_id — verify auto-generation per §3.1.
# No caller_invocation_label. §8.6 requires a trace name but only
# RECOMMENDS the entry-node-name default, so the name is asserted as
# any non-empty string.

expected:
  langfuse_trace:
    id: "<uuid-hex>"
    name: "<any-string>"
    metadata:
      correlation_id: "<corr_id_1>"
      entry_node: "a"
      spec_version: "<any-string>"
    observations:
      - type: span
        name: "a"
        metadata:
          namespace: ["a"]
          step: 0
          attempt_index: 0
          correlation_id: "<corr_id_1>"
        level: DEFAULT
        children: []
      - type: span
        name: "b"
        metadata:
          namespace: ["b"]
          step: 1
          attempt_index: 0
          correlation_id: "<corr_id_1>"
        level: DEFAULT
        children: []
      - type: span
        name: "c"
        metadata:
          namespace: ["c"]
          step: 2
          attempt_index: 0
          correlation_id: "<corr_id_1>"
        level: DEFAULT
        children: []

  # Invariant: the same correlation_id MUST appear on the Trace's
  # metadata.correlation_id AND on every Observation's
  # metadata.correlation_id (cross-cutting per §8.5).
  invariants:
    correlation_id_consistency: true
    # Invariant: the Trace's id MUST equal the invocation_id (which is
    # how cross-system lookup by invocation_id finds the Langfuse
    # Trace per §8.4.1).
    trace_id_equals_invocation_id_dashes_stripped: true
