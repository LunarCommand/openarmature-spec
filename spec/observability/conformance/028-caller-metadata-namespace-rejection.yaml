      no_langfuse_observations_emitted: true

  - name: rejects_reserved_oa_name_error_type
    description: |
      Caller supplies the bare key `error_type`, which exactly matches an
      OA-emitted top-level Langfuse metadata key name written on a failed
      Generation / Embedding / Tool / Retriever observation (§8.4.2, §8.4.3,
      §8.4.5 to §8.4.7). Newly reserved per §3.4 by proposal 0119; without the
      reservation a caller key would silently shadow the failure's error
      classification in Langfuse's flat metadata.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: noop
    nodes:
      noop:
        update: {msg: "should never run"}
    edges:
      - {from: noop, to: END}
    initial_state: {}
    caller_metadata:
      tenantId: "acme-corp"
      error_type: "caller-supplied"
    expected:
      invoke_rejects_at_api_boundary: true
      no_spans_emitted: true
      no_langfuse_observations_emitted: true

  - name: rejects_reserved_oa_name_error_message
    description: |
      Caller supplies the bare key `error_message`, the OA-emitted harvested
      exception text on a failed observation (§8.4.3, §8.4.5 to §8.4.7). Newly
      reserved per §3.4 by proposal 0119. Reserved even though the field is
      gated by `disable_provider_payload` (§5.5.4): the reservation is about
      key collision, not about whether OA emits the value in a given posture.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: noop
    nodes:
      noop:
        update: {msg: "should never run"}
    edges:
      - {from: noop, to: END}
    initial_state: {}
    caller_metadata:
      tenantId: "acme-corp"
      error_message: "caller-supplied"
    expected:
