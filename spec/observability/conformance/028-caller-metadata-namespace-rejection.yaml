  - name: rejects_openarmature_underscore_prefix
    description: |
      Caller supplies a key in the `openarmature_` **underscore** namespace,
      which clears both the dotted `openarmature.` namespace rule and the
      exact-match reserved set, yet collides with the nine metadata keys
      §8.4.5 to §8.4.7 write in that form (`openarmature_input_count`,
      `openarmature_dimensions`, `openarmature_query_length`,
      `openarmature_document_count`, `openarmature_top_k`,
      `openarmature_result_count`, `openarmature_tool_name`,
      `openarmature_tool_call_id`, `openarmature_response_id`). Proposal 0119
      extends the reserved-namespace rule to cover it. The key here is not one
      of the nine, proving the rule is a **namespace** reservation rather than
      nine more exact matches.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: noop
    nodes:
      noop:
        update: {msg: "should never run"}
    edges:
      - {from: noop, to: END}
    initial_state: {}
    caller_metadata:
      tenantId: "acme-corp"
      openarmature_anything: "caller-supplied"
    expected:
      invoke_rejects_at_api_boundary: true
      no_spans_emitted: true
      no_langfuse_observations_emitted: true
