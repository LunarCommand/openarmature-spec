      reserved per §3.4 by proposal 0119.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: noop
    nodes:
      noop:
        update: {msg: "should never run"}
    edges:
      - {from: noop, to: END}
    initial_state: {}
    caller_metadata:
