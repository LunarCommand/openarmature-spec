# graph-engine §6 LlmFailedEvent.error_type — OPTIONAL impl-level /
# vendor-specific error type or code. The field contract is permissive:
# either a vendor error code or an upstream exception class name
# satisfies it, and null is valid when no impl-side type is available.
# Cases 1 and 2 assert the PERMISSIVE contract: error_type is a non-empty
# string, not a verbatim per-style value, so an impl that picks either
# sourcing style conforms. Case 3 does not assert error_type, because the
# two styles give different results when the body carries no type.

cases:
  - name: error_type_populated_with_vendor_code_style
    description: |
      Provider raises provider_rate_limit; the mocked vendor body carries
      an error code. The typed event carries the normative error_category
      and a populated (non-empty) error_type. The fixture asserts
      error_type is populated, NOT a verbatim value — a vendor code or an
      exception class name both satisfy the contract.
    state:
      fields:
        answer:
          type: string
          default: ""
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: answer
    edges:
      - {from: ask, to: END}
    initial_state: {}
    mock_llm:
      - status: 429
        body:
          error:
            type: rate_limit_exceeded
            message: "rate limit exceeded; retry after 60s"
    typed_observers:
      - name: collector
        kind: typed_event_collector
    expected_error:
      category: provider_rate_limit
      raised_from: ask
    expected:
      observers:
        collector:
          contains_event:
            event_type: LlmFailedEvent
            fields:
              error_category: provider_rate_limit
              error_type: "<any-string>"

  - name: error_type_populated_with_exception_class_name_style
    description: |
      Provider raises provider_rate_limit; the mocked vendor body carries
      a class-name-style type. Like case 1, the fixture asserts error_type
      is populated (non-empty) regardless of how the impl sources it; it
      does not pin the sourcing style.
    state:
      fields:
        answer:
          type: string
          default: ""
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: answer
    edges:
      - {from: ask, to: END}
    initial_state: {}
    mock_llm:
      - status: 429
        body:
          error:
            type: RateLimitError
            message: "rate limit exceeded"
    typed_observers:
      - name: collector
        kind: typed_event_collector
    expected_error:
      category: provider_rate_limit
      raised_from: ask
    expected:
      observers:
        collector:
          contains_event:
            event_type: LlmFailedEvent
            fields:
              error_category: provider_rate_limit
              error_type: "<any-string>"

  - name: error_type_null_when_no_impl_side_type_available
    description: |
      Provider raises a §7 category exception and the mocked body
      carries no vendor error type. The typed event carries the
      always-required error_category. The case does not assert
      error_type: an implementation that sources it from the vendor
      body has nothing to report and leaves it null, while one that
      sources it from the exception class name has a value. Both
      sourcing styles are allowed (graph-engine §6).
    state:
      fields:
        answer:
          type: string
          default: ""
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: answer
    edges:
      - {from: ask, to: END}
    initial_state: {}
    mock_llm:
      - status: 503
        body:
          # No `error.type` field in the vendor body.
          error: {message: "service unavailable"}
    typed_observers:
      - name: collector
        kind: typed_event_collector
    expected_error:
      category: provider_unavailable
      raised_from: ask
    expected:
      observers:
        collector:
          contains_event:
            event_type: LlmFailedEvent
            fields:
              error_category: provider_unavailable
