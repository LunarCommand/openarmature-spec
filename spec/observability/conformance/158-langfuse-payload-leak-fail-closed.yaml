# Langfuse payload-leak invariant — fail-closed / suppress / opt-out (observability
# §6, proposal 0116). When openarmature constructs the Langfuse client (mode b) and
# the Langfuse observer emits payloads, those payloads MUST NOT reach a provider
# shared with the application unless the caller has explicitly accepted a shared
# provider. Here a same-credential Langfuse client is primed BEFORE openarmature
# constructs, so the SDK's per-credential singleton hands openarmature the cached
# client on the global provider and its own isolated provider is discarded — the
# leak condition. openarmature's response depends on whether it can establish the
# binding (best-effort, non-portable) and on the caller opt-out.
#
# Harness contract additions (conformance-adapter §5.5 / §6.4, proposal 0116):
#   - langfuse_client: {preexisting_same_key_client: true} — the harness constructs a
#     same-credential client first (bound to the global provider, per the
#     provider-faithful default), priming the singleton so openarmature is not first.
#   - langfuse_client: {accept_shared_provider: <bool>} — the single shared-provider
#     caller opt-out on openarmature's Langfuse observer construction.
#   - requires_capability: {langfuse_bound_provider_detection: <bool>} — the case is
#     asserted only against adapters whose declared adapter_capabilities match. Raise
#     cases require detection; the suppress case requires its absence; the opt-out
#     case applies to all.
#   - expected_construction_error: {category} — asserts the case raises the categorized
#     error at observer/client construction or first use.
#   - expected.no_payload_bearing_langfuse_observations_on_global /
#     expected.payload_bearing_langfuse_observations_on_global — payload-scoped leak
#     assertions (the §6.4 fake distinguishes a payload-bearing observation from a
#     payload-free one).
#   - expected.log_records[].level — asserts the diagnostic's OTel severity.
#
# The 0116 cases (first group) have the Langfuse observer emit the PROVIDER payload
# (disable_provider_payload false). The proposal-0117 STATE-channel cases add
# langfuse_observer.disable_state_payload false, or a trace_input_from_state hook
# (proposal 0043 / fixture 037), with the provider payload OFF so the state channel
# is gated independently.
#
# The two ERROR-MESSAGE cases run with the provider payload ON. Proposal 0118 brought
# a failed observation's error_message under disable_provider_payload, so a flag-ON
# configuration would have the FLAG withhold the message and assert nothing about §6;
# with the flag off, the SUPPRESS arm is what withholds it, which is the remaining §6
# behavior for this channel. Both are therefore restricted to non-detection-capable
# adapters (a detection-capable adapter raises at construction instead). The flag's own
# effect is gated by fixture 159, and the Tool anti-smuggling clause additionally by
# fixture 098's default-posture case. error_type stays present throughout: it is a
# classification token and is not gated.
# All cases: mode credentials, a same-credential client pre-exists on the global
# provider, and caller_global_otel_active installs a global exporter to catch leaks.
# A case with no requires_capability applies to all adapters.

cases:
  - name: singleton_preexists_raises
    description: |
      Detection-capable adapter, no opt-out. A same-credential Langfuse client
      already exists on the global provider, so openarmature's fresh isolated
      provider is discarded (the singleton returns the cached client). The OTel
      observer suppresses payload (its §5.5.4 default True) while the Langfuse
      observer emits it. openarmature establishes that its payload-bearing
      observations would reach the global (shared) provider and MUST raise
      langfuse_provider_isolation_unavailable before emitting any payload-bearing
      observation there — rather than proceed and silently leak.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158a
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "hello"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    requires_capability:
      langfuse_bound_provider_detection: true
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: false
    caller_global_otel_active: true
    # Fail-closed: the categorized error is raised at construction / first use.
    # Top-level (sibling of `expected:`), like expected_compile_error.
    expected_construction_error:
      category: langfuse_provider_isolation_unavailable
    expected:
      # Load-bearing: no payload-bearing Langfuse observation reached the shared
      # provider before the raise (a metadata-only span may, and does not violate
      # the payload invariant).
      no_payload_bearing_langfuse_observations_on_global: true

  - name: singleton_preexists_raises_otel_not_suppressing
    description: |
      Same as above (detection-capable, no opt-out, same-credential client
      pre-exists) but the OTel observer does NOT suppress payload
      (disable_provider_payload false on the OTel side too). Under the former
      OTel-suppression-specific carve-out this would NOT fire — there is no OTel
      suppression to defeat. Under the payload-leak invariant it still MUST raise:
      the trigger is the Langfuse payload reaching a shared provider, independent
      of any composed OTel observer's setting.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158b
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "hey"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    requires_capability:
      langfuse_bound_provider_detection: true
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    disable_provider_payload: false  # OTel side ALSO emits payload — no suppression to "defeat"
    langfuse_observer:
      disable_provider_payload: false
    caller_global_otel_active: true
    expected_construction_error:
      category: langfuse_provider_isolation_unavailable
    expected:
      no_payload_bearing_langfuse_observations_on_global: true

  - name: singleton_preexists_suppresses
    description: |
      Non-detection-capable adapter (its SDK surface exposes no way to establish
      the client's bound provider), no opt-out. openarmature cannot confirm the
      leak, so it MUST NOT raise; instead it suppresses its own Langfuse-side
      payload (fail-safe) so no payload-bearing observation can reach the shared
      provider, and MUST emit a WARNING. The observation still flows to the global
      provider through the (primed) client, but payload-free — the observable
      proof of suppression. This is the portable floor.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158c
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "howdy"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    requires_capability:
      langfuse_bound_provider_detection: false
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: false
    caller_global_otel_active: true
    expected:
      # Fail-safe: no raise, but no payload reaches the shared provider.
      langfuse_observations_on_global: true            # the observation reaches global...
      no_payload_bearing_langfuse_observations_on_global: true  # ...but payload-free (suppressed)
      log_records:
        - level: WARNING

  - name: singleton_preexists_optout_proceeds
    description: |
      Any adapter, caller opted in (accept_shared_provider true). The caller has
      explicitly accepted a shared provider, so openarmature MUST NOT raise and
      MUST NOT suppress — it emits a WARNING and proceeds. The Generation
      observation reaches the global provider WITH payload: the acknowledged leak
      the caller signed off on.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158d
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "hi there"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: true
    langfuse_observer:
      disable_provider_payload: false
    caller_global_otel_active: true
    expected:
      # Acknowledged leak by effect: a payload-bearing observation reaches global.
      payload_bearing_langfuse_observations_on_global: true
      log_records:
        - level: WARNING

  # ---- proposal 0117: the state and error-message harvested channels ----

  - name: state_channel_preexists_raises
    description: |
      Detection-capable adapter, no opt-out. The provider payload is OFF
      (disable_provider_payload true) but the STATE payload is ON
      (disable_state_payload false) — the Trace input/output carries raw
      application state. openarmature establishes the state payload would reach
      the shared (primed) provider and MUST raise. Proves the trigger fires on
      the state channel ALONE, independent of the provider payload.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158e
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "hello"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    requires_capability:
      langfuse_bound_provider_detection: true
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: true    # provider channel OFF
      disable_state_payload: false      # state channel ON — the only live channel
    caller_global_otel_active: true
    expected_construction_error:
      category: langfuse_provider_isolation_unavailable
    expected:
      no_payload_bearing_langfuse_observations_on_global: true

  - name: hook_preexists_raises
    description: |
      Detection-capable adapter, no opt-out. BOTH payload knobs at their default
      (disable_provider_payload true, disable_state_payload true) — but a
      trace_input_from_state hook is supplied. Per §8.4.1 a supplied hook emits
      regardless of the knob, so the state channel is potentially live and
      openarmature MUST raise. Proves a supplied hook triggers under the full
      default privacy posture.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158f
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "hey"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    requires_capability:
      langfuse_bound_provider_detection: true
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: true
      disable_state_payload: true       # knobs default/off ...
      trace_input_from_state: returns_job_input_summary   # ... but a hook is supplied
    caller_global_otel_active: true
    expected_construction_error:
      category: langfuse_provider_isolation_unavailable
    expected:
      no_payload_bearing_langfuse_observations_on_global: true

  - name: error_message_omitted_on_shared
    description: |
      Non-detection-capable adapter (proposal 0118 repoint). The provider payload
      is ON (disable_provider_payload false), so the harvested error message is
      permitted by the flag and the payload channel is live; openarmature cannot
      establish the binding, so it takes the SUPPRESS arm rather than raising. A
      rerank call then FAILS. Suppress-all MUST cover the error message too: the
      failed Retriever observation reaches the global provider (proving it is not
      wholly dropped) but payload-free, with error_message omitted and the
      error_type plus the error category / statusMessage — none of which is
      harvested text — retained,
      plus the mandated WARNING. Gates "suppress-all covers the harvested error
      message," which is the remaining §6 behavior for this channel now that the
      flag governs it under the default posture (fixture 159 gates the flag
      itself). Before 0118 this case ran with the payload flag ON, which under
      0118's gating would suppress the message by flag alone and assert nothing
      about §6.
    state:
      fields:
        rerank_response:
          type: record
          default: null
    entry: rerank_node
    nodes:
      rerank_node:
        calls_rerank:
          query: "paris"
          documents: ["doc one", "doc two"]
          top_k: 2
          stores_response_in: rerank_response
    edges:
      - {from: rerank_node, to: END}
    initial_state: {}
    mock_rerank:
      - status: 503
        raises:
          error_type: "ServiceUnavailableError"
          message: "the rerank endpoint returned 503"
    requires_capability:
      langfuse_bound_provider_detection: false
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: false   # flag permits the message; suppress-all must still omit it
    caller_global_otel_active: true
    # The rerank failure propagates as the invocation error (as in fixture 151);
    # this is NOT the isolation raise (the suppress arm does not raise).
    expected_error:
      category: provider_unavailable
      raised_from: rerank_node
    expected:
      # Non-vacuity trio: the failed Retriever observation is present and ERROR-level
      # with its error CATEGORY retained, distinguishing message omission from
      # category-drop and from whole-observation drop.
      langfuse_trace:
        id: "<uuid-hex>"
        observations:
          - type: span
            name: "rerank_node"
            children:
              - type: retriever
                name: "openarmature.rerank.complete"
                level: ERROR
                statusMessage: "provider_unavailable"   # category retained (not payload)
                input: null
                output: null
                metadata:
                  error_type: "ServiceUnavailableError"   # retained: classification, not harvested text
                metadata_absent: [error_message]
                children: []
      # The failed Retriever DID reach the global provider (not wholly dropped) ...
      langfuse_observations_on_global: true
      # ... but payload-free: suppress-all omitted the error message.
      no_payload_bearing_langfuse_observations_on_global: true
      log_records:
        - level: WARNING

  - name: tool_failure_omitted_on_shared
    description: |
      Non-detection-capable adapter (proposal 0118 repoint). The provider payload is
      ON, so the harvested error message is permitted by the flag and the channel is
      live; openarmature cannot establish the binding, so it SUPPRESSES rather than
      raising. A tool call then FAILS. A ToolCallFailedEvent carries error_type /
      error_message but NO error category (§5.5.12), so this case gates §6's Tool
      anti-smuggling clause under suppression: openarmature omits error_message,
      RETAINS error_type (a classification token, not harvested text, §5.5.4),
      AND MUST NOT surface the message through statusMessage as a
      substitute. The Tool observation reaches the global provider at ERROR but
      payload-free (identity metadata retained), with statusMessage null: an impl
      copying the exception into statusMessage fails the statusMessage: null
      assertion, and one leaving error_message in metadata fails both
      metadata_absent and no_payload_bearing. Does NOT raise (the suppress arm);
      the tool failure itself propagates as node_exception.
    state:
      fields:
        out: {type: record, default: null}
    entry: run_tool
    nodes:
      run_tool:
        calls_tool:
          tool_name: "get_weather"
          tool_call_id: "call_def456"
          arguments: {city: "Paris"}
          mock_tool: {raises: {error_type: "TimeoutError", message: "tool timed out"}}
    edges:
      - {from: run_tool, to: END}
    initial_state: {}
    requires_capability:
      langfuse_bound_provider_detection: false
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: false   # flag permits the message; suppress-all must still omit it
    caller_global_otel_active: true
    # The tool failure propagates as the invocation error (as in fixture 093/098);
    # this is NOT the isolation raise (the suppress arm does not raise).
    expected_error:
      category: node_exception
      raised_from: run_tool
    expected:
      # Anti-smuggling: the Tool observation is present at ERROR with its identity
      # metadata, but statusMessage carries NO message-derived text (a Tool
      # failure has no category, and the exception message MUST NOT be smuggled
      # here). error_message is omitted from metadata; error_type is RETAINED and
      # asserted below, since suppress-all withholds harvested text only.
      langfuse_trace:
        id: "<uuid-hex>"
        observations:
          - type: span
            name: "run_tool"
            children:
              - type: tool
                name: "openarmature.tool.call"
                level: ERROR
                statusMessage: null
                # Suppress-all forces the provider payload off even though the flag
                # permits it, so the tool arguments MUST NOT appear here.
                input: null
                output: null
                metadata:
                  openarmature_tool_name: "get_weather"
                  openarmature_tool_call_id: "call_def456"
                  error_type: "TimeoutError"    # retained: classification, not harvested text
                metadata_absent: [error_message]
                children: []
      langfuse_observations_on_global: true
      no_payload_bearing_langfuse_observations_on_global: true
      log_records:
        - level: WARNING

  - name: locked_down_failure_on_detected_shared_provider_does_not_raise
    description: |
      Detection-capable adapter, no opt-out, FULLY locked-down posture
      (disable_provider_payload true, disable_state_payload true, no hook). A rerank
      call then fails. openarmature CAN establish that the primed client is on the
      shared global provider, but no payload channel is live, so §6's No-hard-failure
      rule applies and it MUST NOT raise. Restores the coverage proposal 0118's
      repoint removed: before the repoint, the two error-message cases ran locked down
      and were the corpus's only place a DETECTED shared provider met a
      no-live-channel run. Repointing them to the flag-off suppress arm (and gating
      them to non-detection-capable adapters) left nothing asserting that an
      implementation must NOT raise here, so an over-eager impl that raises on any
      detected shared provider would have passed. Observations still reach the global
      provider, but payload-free: with the flag on, a failed observation carries its
      error_type and category and no harvested text.
    state:
      fields:
        rerank_response:
          type: record
          default: null
    entry: rerank_node
    nodes:
      rerank_node:
        calls_rerank:
          query: "paris"
          documents: ["doc one", "doc two"]
          top_k: 2
          stores_response_in: rerank_response
    edges:
      - {from: rerank_node, to: END}
    initial_state: {}
    requires_capability:
      langfuse_bound_provider_detection: true
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: true      # locked down: no channel live ...
      disable_state_payload: true         # ... on either axis, and no hook supplied
    caller_global_otel_active: true
    # The rerank failure propagates as the invocation error. Critically there is NO
    # expected_construction_error: detecting a shared provider is not itself a raise
    # trigger when nothing harvested would reach it.
    expected_error:
      category: provider_unavailable
      raised_from: rerank_node
    expected:
      langfuse_trace:
        id: "<uuid-hex>"
        observations:
          - type: span
            name: "rerank_node"
            children:
              - type: retriever
                name: "openarmature.rerank.complete"
                level: ERROR
                statusMessage: "provider_unavailable"
                input: null
                output: null
                metadata:
                  error_type: "ServiceUnavailableError"
                metadata_absent: [error_message]
                children: []
      langfuse_observations_on_global: true
      no_payload_bearing_langfuse_observations_on_global: true

  - name: state_channel_preexists_suppresses
    description: |
      Non-detection-capable adapter, no opt-out. The state channel is ON
      (disable_state_payload false). openarmature cannot establish the binding, so
      it MUST NOT raise; it suppresses ALL harvested channels — forcing the §8.4.1
      minimal stub for the Trace — and warns. The Trace reaches the global provider
      but payload-free (the stub). Portable suppress floor for the state channel.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158g
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "howdy"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    requires_capability:
      langfuse_bound_provider_detection: false
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: true
      disable_state_payload: false      # state channel ON — suppressed to the stub
    caller_global_otel_active: true
    expected:
      langfuse_observations_on_global: true
      no_payload_bearing_langfuse_observations_on_global: true
      log_records:
        - level: WARNING

  - name: hook_preexists_suppresses
    description: |
      Non-detection-capable adapter, no opt-out, a trace_output_from_state hook
      supplied (knobs default) — exercising the output-hook spelling
      (hook_preexists_raises uses the input hook, so both §8.4.1 hooks are
      covered). openarmature cannot establish the binding, so it suppresses —
      forcing the §8.4.1 minimal stub, which means the hook is NOT applied. The
      Trace reaches the global provider as the stub (payload-free), with a
      WARNING. Gates the suppress arm's hook-drop half: the hook_preexists_raises
      case raises before rendering, so it never exercises suppression of a
      supplied hook.
    state:
      fields:
        msg:
          type: string
          default: ""
    entry: ask_llm
    nodes:
      ask_llm:
        calls_llm:
          messages: [{role: user, content: "hi"}]
          stores_response_in: msg
    edges:
      - {from: ask_llm, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-158h
          object: chat.completion
          model: test-model
          choices:
            - {index: 0, message: {role: assistant, content: "hi there"}, finish_reason: stop}
          usage: {prompt_tokens: 5, completion_tokens: 1, total_tokens: 6}
    requires_capability:
      langfuse_bound_provider_detection: false
    langfuse_client:
      mode: credentials
      preexisting_same_key_client: true
      accept_shared_provider: false
    langfuse_observer:
      disable_provider_payload: true
      disable_state_payload: true
      trace_output_from_state: returns_job_output_summary   # output-hook supplied — suppressed to the stub
    caller_global_otel_active: true
    expected:
      langfuse_observations_on_global: true
      no_payload_bearing_langfuse_observations_on_global: true
      log_records:
        - level: WARNING
