    otel_observer: {}
    langfuse_observer: {}
    typed_observers:
      - name: collector
        kind: typed_event_collector
    expected_error:
      category: structured_output_invalid
      raised_from: ask
    expected:
      llm_spans:
        - attempt_index: 0
