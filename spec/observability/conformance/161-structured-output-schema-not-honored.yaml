# observability §5.5.7 "A schema the provider did not honor", the §5.5 path
# attribute, and graph-engine §6 structured_output_path (proposal 0126).
#
# For each wire attempt, the implementation MUST emit exactly one WARNING log
# record carrying openarmature.structured_output.schema_not_honored when the
# attempt failed structured_output_invalid with content that is not well-formed
# JSON or not a JSON object, on the "native" path, with finish_reason "stop" and
# no stop sequence on its request. It MUST NOT emit in any other case.
#
# Harness notes for this fixture:
#   - Every case except case 14 and its twin, case 24, carries
#     `otel_observer: {}` and `langfuse_observer: {}`, so both backend
#     observers are composed (conformance-adapter §5.5). An absence case
#     therefore covers a check placed in either observer, and each record
#     count catches one that emits once per observer. Cases 14 and 24 carry
#     `otel_observer: {attached: false}` and no Langfuse key, so they compose
#     neither, and a record that depends on an observer being attached is
#     caught too.
#   - Log records are captured for the whole case and asserted after observer
#     delivery completes (conformance-adapter §5.5).
#   - `<call_id_X>` is a binding token (conformance-adapter §5.10) for a
#     call's graph-engine §6 `call_id`. A record's `openarmature.llm.call_id`
#     and the call's typed event bind the same token, so the record joins to
#     its call.
#   - `<path_X>` is a binding token (conformance-adapter §5.10) for a call's
#     `structured_output_path`. Where more than one path can be right, the
#     event and the span's path attribute bind the same token, so the two
#     must agree.
#   - The schema satisfies OpenAI's strict-mode rules. llm-provider §8.1.5
#     says an implementation SHOULD then send `strict: true`, which makes the
#     path "native"; without it the path is "native_unenforced". The cases
#     that expect the record are gated on `llm_strict_native_schema: true`
#     (conformance-adapter §5.17). Cases 20 to 27 are their twins, gated on
#     `false`: the same inputs and assertions, with the "native_unenforced"
#     path and no record. The native cases that expect no record hold on
#     either path, so they are ungated. llm-provider fixture 026 pins
#     `strict: true` on the wire in its case gated on the same capability.
#   - Case 8 is gated on `llm_prompt_augmentation_fallback: true`, since
#     llm-provider §8.1.5.1's fallback is a SHOULD. Case 28 runs its inputs
#     ungated and asserts what holds with or without the fallback.
#   - Under call-level retry each wire attempt takes the next `mock_llm` entry.
#     A caught attempt emits no typed event (graph-engine §6, as in fixture
#     116), so the retry cases assert the call's single terminal event, each
#     attempt's span through `llm_spans`, and the per-attempt records or, in
#     the twins, their absence.
#   - Every case that expects the record sets `caller_correlation_id`, so the
#     record's `openarmature.correlation_id` is asserted as that literal value.
#   - Case 17 streams, using `calls_llm.stream` and `mock_llm_stream` (this
#     directory's harness note, fixture 001's header) and
#     `contains_events_in_order` (conformance-adapter §5.5). Its chunks carry
#     `delta: {refusal: ...}`, OpenAI's refusal delta (llm-provider §8.1.6), a
#     chunk shape the note's list does not show.


cases:
  - name: native_not_json_on_stop_emits_once
    description: |
      The model finished on its own ("stop") with prose instead of JSON on the
      native path, and the request carried no stop sequence. A constrained
      response cannot be malformed, so exactly one record is emitted. The
      response reports a dated model name, so the record must name the model
      the provider is bound to, not the one the response reports.
    state:
      fields:
        answer: {type: string, default: ""}
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "Generate a person record."}]
          model: gpt-test
          stores_response_in: answer
          response_schema:
            type: object
            properties:
              name: {type: string}
              age: {type: integer}
            required: [name, age]
            additionalProperties: false
    edges:
      - {from: ask, to: END}
    initial_state: {}
    caller_correlation_id: "corr-161-a"
    mock_llm:
      - status: 200
        body:
          id: cc-161a
          object: chat.completion
          created: 1700000000
          model: gpt-test-2026-01-01
          choices:
            - {index: 0, message: {role: assistant, content: "Sure, the person is Alice, aged 30."}, finish_reason: stop}
          usage: {prompt_tokens: 20, completion_tokens: 10, total_tokens: 30}
    requires_capability:
      llm_strict_native_schema: true
    otel_observer: {}
    langfuse_observer: {}
    typed_observers:
      - name: collector
        kind: typed_event_collector
    expected_error:
      category: structured_output_invalid
      raised_from: ask
    expected:
      llm_spans:
        - attempt_index: 0
          attributes:
            "openarmature.llm.structured_output.path": native
          error_category: structured_output_invalid
      observers:
        collector:
          contains_event:
            event_type: LlmFailedEvent
            fields:
              error_category: structured_output_invalid
              structured_output_path: native
              finish_reason: stop
              model: gpt-test
              response_model: gpt-test-2026-01-01
              call_id: "<call_id_a>"
      log_records:
        - event_name: openarmature.structured_output.schema_not_honored
          count: 1
        - level: WARNING
          event_name: openarmature.structured_output.schema_not_honored
          attributes:
            "openarmature.llm.provider": openai
            "openarmature.llm.model": gpt-test
            "openarmature.llm.call_id": "<call_id_a>"
            "openarmature.llm.attempt_index": 0
            "openarmature.correlation_id": "corr-161-a"

