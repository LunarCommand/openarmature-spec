  - name: native_refusal_reported_as_stop_absent
    description: |
      An OpenAI refusal on the native path: the message carries the refusal
      text in `refusal`, no content, and OpenAI reports "stop". llm-provider
      §8.1.2 makes the refusal text the content and the finish_reason
      "content_filter", so the failure is a refusal, not a malformed reply on a
      normal finish, and no record is emitted. A check that read OpenAI's
      reported finish_reason instead of the mapped one would emit here.
    state:
      fields:
        answer: {type: string, default: ""}
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "Generate a person record."}]
          model: gpt-test
          stores_response_in: answer
          response_schema:
            type: object
            properties:
              name: {type: string}
              age: {type: integer}
            required: [name, age]
            additionalProperties: false
