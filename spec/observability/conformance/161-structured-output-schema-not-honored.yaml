      The event's input_messages are the list as sent: the schema directive
      as a leading system message, in the wire shape fixture 027 asserts, and
      the caller's message.
    state:
      fields:
        answer: {type: string, default: ""}
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "Generate a person record."}]
          model: gpt-test
          stores_response_in: answer
          response_schema:
            type: object
            properties:
              name: {type: string}
              age: {type: integer}
            required: [name, age]
            additionalProperties: false
    edges:
      - {from: ask, to: END}
    initial_state: {}
    mock_llm:
      capabilities:
        supports_native_response_format: false
      responses:
        - status: 200
          body:
            id: cc-161h
            object: chat.completion
            created: 1700000000
            model: gpt-test
            choices:
              - {index: 0, message: {role: assistant, content: "Alice is thirty"}, finish_reason: stop}
