      - {from: ask, to: END}
    initial_state: {}
    mock_llm:
      - status: 200
        body:
          id: cc-161p
          object: chat.completion
          created: 1700000000
          model: gpt-test
          choices:
            - {index: 0, message: {role: assistant, content: null, refusal: "I can't help with that."}, finish_reason: stop}
          usage: {prompt_tokens: 20, completion_tokens: 7, total_tokens: 27}
    otel_observer: {}
    langfuse_observer: {}
    typed_observers:
      - name: collector
        kind: typed_event_collector
    expected_error:
