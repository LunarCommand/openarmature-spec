  - name: rejected_before_sending_path_null
    description: |
      A schema is supplied, but the call's extras carry a conflicting
      response_format, which llm-provider §8.1.5 rejects before sending with
      provider_invalid_request. No request was sent, so the failure event's
      structured_output_path is present and null, and no record is emitted.
      Whether a call rejected before sending gets an LLM span is not
      specified, so this case asserts only the event.
    state:
      fields:
        answer: {type: string, default: ""}
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "Generate a person record."}]
          model: gpt-test
          stores_response_in: answer
          config:
            extras:
              response_format: {type: json_object}
          response_schema:
            type: object
            properties:
              name: {type: string}
              age: {type: integer}
            required: [name, age]
            additionalProperties: false
    edges:
      - {from: ask, to: END}
    initial_state: {}
    mock_llm:
      # Never requested: the call is rejected before sending.
      - status: 200
        body:
          id: cc-161k
          object: chat.completion
          created: 1700000000
          model: gpt-test
          choices:
            - {index: 0, message: {role: assistant, content: '{"name":"Alice","age":30}'}, finish_reason: stop}
          usage: {prompt_tokens: 20, completion_tokens: 9, total_tokens: 29}
    otel_observer: {}
    langfuse_observer: {}
    typed_observers:
      - name: collector
        kind: typed_event_collector
    expected_error:
      category: provider_invalid_request
      raised_from: ask
    expected:
      observers:
        collector:
          contains_event:
            event_type: LlmFailedEvent
            fields:
              error_category: provider_invalid_request
              structured_output_path: null
      log_records_absent:
        - event_name: openarmature.structured_output.schema_not_honored

  - name: reask_recovers_record_for_attempt_0
    description: |
      Call-level retry with reask. Attempt 0 returns prose on "stop" (no
      typed event, since the retry loop catches it); attempt 1 returns valid
      content and the call completes. The record is emitted once, for attempt
      0, so a reask that recovers does not hide the dropped constraint. The
      call's single completion event reports attempt 1, so its input_messages
      end with attempt 0's output and the rendered correction.
    state:
      fields:
        answer: {type: string, default: ""}
    entry: ask
    nodes:
      ask:
        calls_llm:
          messages: [{role: user, content: "Generate a person record."}]
          model: gpt-test
          stores_response_in: answer
          retry:
            max_attempts: 2
            backoff: {type: deterministic, seconds: 0}
            reask: {template: "Return only the JSON object."}
          response_schema:
            type: object
            properties:
              name: {type: string}
              age: {type: integer}
            required: [name, age]
            additionalProperties: false
    edges:
      - {from: ask, to: END}
    initial_state: {}
    caller_correlation_id: "corr-161-l"
    mock_llm:
      - status: 200
        body:
          id: cc-161l-0
          object: chat.completion
          created: 1700000000
          model: gpt-test
          choices:
            - {index: 0, message: {role: assistant, content: "Alice is thirty"}, finish_reason: stop}
          usage: {prompt_tokens: 20, completion_tokens: 4, total_tokens: 24}
      - status: 200
        body:
          id: cc-161l-1
          object: chat.completion
          created: 1700000001
          model: gpt-test
