            event_type: LlmFailedEvent
            fields:
              error_category: structured_output_invalid
              structured_output_path: native
              finish_reason: content_filter
              output_content: "I can't help with that."
      log_records_absent:
        - event_name: openarmature.structured_output.schema_not_honored

