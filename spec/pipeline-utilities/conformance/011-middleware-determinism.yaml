# Determinism: deterministic retry middleware (jitter swapped for fixed
# backoff). Two runs of an identical mocked-failure-then-success scenario
# MUST produce identical final state and identical observer event sequences.
#
# It sets `run_count: 2` at the case level, so the harness runs the graph
# twice and checks each run against `expected:` (conformance-adapter §5.7).
# Both runs must therefore produce the asserted final state and observer
# event sequence.

state:
  fields:
    v:
      type: int
      default: 0
    trace:
      type: list<string>
      reducer: append
      default: []

entry: target

nodes:
  target:
    flaky:
      failure_sequence:
        - {transient: true, category: provider_rate_limit, message: "throttle 1"}
        - {transient: true, category: provider_rate_limit, message: "throttle 2"}
      success_update: {v: 100, trace: ["target"]}

edges:
  - {from: target, to: END}

initial_state: {}

middleware:
  per_node:
    target:
      - type: retry
        max_attempts: 3
        backoff: {type: deterministic, seconds: 0}

observers:
  - {name: obs, attach: graph, target: outer, behavior: record}

run_count: 2

expected:
  final_state: {v: 100, trace: ["target"]}
  execution_order: [target]
  # Per-attempt event pairs (per graph-engine §6 pair model): 3 attempts for
  # `target`, attempt_index 0/1/2. Each attempt produces a started/completed
  # pair, so 6 events total. The first 4 events are pairs ending in `error`
  # (transient failures); the final 2 are a pair ending in `post_state`
  # (success). Run 1 and Run 2 MUST produce identical sequences.
  observer_events:
    obs:
      - {step: 0, phase: started,   node_name: target, attempt_index: 0, namespace: [target],
         pre_state: {v: 0, trace: []}}
      - {step: 0, phase: completed, node_name: target, attempt_index: 0, namespace: [target],
         pre_state: {v: 0, trace: []}, error: {category: node_exception}}
      - {step: 0, phase: started,   node_name: target, attempt_index: 1, namespace: [target],
         pre_state: {v: 0, trace: []}}
      - {step: 0, phase: completed, node_name: target, attempt_index: 1, namespace: [target],
         pre_state: {v: 0, trace: []}, error: {category: node_exception}}
      - {step: 0, phase: started,   node_name: target, attempt_index: 2, namespace: [target],
         pre_state: {v: 0, trace: []}}
      - {step: 0, phase: completed, node_name: target, attempt_index: 2, namespace: [target],
         pre_state: {v: 0, trace: []}, post_state: {v: 100, trace: ["target"]}}
