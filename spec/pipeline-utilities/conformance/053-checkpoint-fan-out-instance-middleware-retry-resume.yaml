# Instance-middleware retry composition (§10.11.3): per-instance resume
# composes with retry middleware applied at the instance level. A retry-
# exhausted instance whose `in_flight` state was saved re-runs on resume
# with `attempt_index` reset to 0 per §10.6. flaky_per_index raises
# provider_unavailable here, a transient category the retry middleware's
# default classifier retries (§6.1), so the failing instance's attempts
# exhaust. It is the last instance, so no sibling can start while it fails
# under fail_fast, and the first run's attempt count is fixed.

subgraph:
  name: flaky_step
  state:
    fields:
      input:
        type: int
        default: 0
      out:
        type: int
        default: 0
  entry: work
  nodes:
    work:
      flaky_per_index:
        # Instance 2 fails every attempt of the first run, so its retries
        # exhaust; it succeeds on resume (fresh attempt_index, fresh mock).
        fail_first_run_indices: [2]
        category: provider_unavailable
        success_compute: {out: input}
  edges:
    - {from: work, to: END}

cases:
  - name: retry_exhausted_instance_resumes_with_fresh_budget
    description: |
      Fan-out with 3 instances [10, 20, 30], dispatched serially, and
      instance middleware that retries up to 3 attempts. Instances 0 and 1
      succeed on their first attempts and record results 10 and 20.
      Instance 2's work raises provider_unavailable on every attempt of the
      first run, so its retry middleware exhausts all 3 attempts and the
      fan-out raises under fail_fast. Instance 2's state at save time is
      `in_flight` (no accumulator entry: the failure prevented the
      `completed` save from firing). It is the last instance, so no
      sibling can start while it fails, and the work body runs five times
      in the first run.

      Saved record: instances 0 and 1 = `completed` with results 10 and
      20; instance 2 = `in_flight`.

      On resume, instance 2 re-runs with `attempt_index` reset to 0
      (fresh retry budget per §10.6). A different mock injection allows
      the work to succeed on the first attempt. Instances 0 and 1 are
      skipped. Final state reflects all instances succeeding.
    state:
      fields:
        items:
          type: list<int>
          default: [10, 20, 30]
        results:
          type: list<int>
          reducer: append
          default: []
    entry: process
    nodes:
      process:
        fan_out:
          subgraph: flaky_step
          items_field: items
          item_field: input
          collect_field: out
          target_field: results
          error_policy: fail_fast
          concurrent_mode: serial
          instance_middleware:
            - type: retry
              max_attempts: 3
              backoff: {type: deterministic, seconds: 0}
    edges:
      - {from: process, to: END}
    initial_state: {}
    checkpointer: in_memory
    first_run_expected_error:
      # The exhausted error's own category (conformance-adapter §5.8).
      category: provider_unavailable
      raised_from: process
    first_run_expected:
      # Instances 0 and 1 once each, and instance 2's three attempts.
      flaky_call_count: 5
    saved_record_assertions:
      fan_out_progress:
        process:
          instance_count: 3
          instances:
            - {state: completed, result: 10, result_is_error: false}
            - {state: completed, result: 20, result_is_error: false}
            - {state: in_flight, result_is_error: false}
    resume:
      from_first_run: true
      expected:
        final_state:
          items: [10, 20, 30]
          results: [10, 20, 30]
        instances_executed_during_resume: [2]
        instances_skipped_during_resume: [0, 1]
      invariants:
        # Per §10.6 and §10.11.3: attempt_index restarts at 0 on resume
        # rather than continuing from the first run's three attempts.
        instance_2_attempt_index_on_resume: 0
        # Instance 2 succeeds on first attempt of resumed run (no
        # retries needed because the mock injection differs).
        instance_2_resume_attempt_count: 1
