# §6.3 Failure isolation: the default predicate (always true) catches an
# uncategorized error, one that does NOT carry a category. The framework-
# emitted event's caught_exception.category is null, and
# caught_exception.message is the error's message.

state:
  fields:
    result:
      type: string
      default: ""

entry: failing

nodes:
  failing:
    # conformance-adapter §5.1's string form raises an uncategorized error
    # with this message, as fixture 006 does.
    raises: "bad input"

edges:
  - {from: failing, to: END}

initial_state: {}

middleware:
  per_node:
    failing:
      - type: failure_isolation
        degraded_update: {result: "degraded"}
        event_name: "parse_failed"
        # No predicate field supplied — default always-true applies.

expected:
  final_state:
    result: "degraded"
  execution_order: [failing]

  expected_failure_isolation_event:
    event_name: "parse_failed"
    wrapped_node_lineage:
      namespace: [failing]
      attempt_index: 0
      fan_out_index: null
      branch_name: null
    pre_state: {result: ""}
    post_state: {result: "degraded"}
    caught_exception:
      category: null
      message: "bad input"
  invariants:
    default_predicate_catches_bare_exception: true
    caught_exception_category_null_for_non_categorized: true
    caught_exception_message_captures_str_exc: true
    engine_sees_degraded_return: true
