# §3 Prompt.sampling opt-in: a backend that does NOT supply sampling
# config returns Prompt with sampling absent (None / null). The manager
# does NOT default the field at any layer.

backends:
  - name: local
    prompts:
      - name: minimal
        label: production
        version: v1
        template: "Hello, {{ name }}!"
        template_hash: "sha256:minimal-v1"
        # No sampling field supplied.

manager:
  backends: [local]

calls:
  - target: manager
    operation: fetch
    name: minimal
    label: production
    capture_as: prompt
  - target: manager
    operation: get
    name: minimal
    label: production
    variables: {name: "Alice"}
    capture_as: rendered

expected:
  # sampling MUST be absent (null or missing) on the fetched Prompt and on
  # the rendered PromptResult; the manager MUST NOT synthesize a default
  # sampling config at either layer.
  prompt:
    name: minimal
    label: production
  prompt_absent_keys: [sampling]
  rendered:
    name: minimal
    label: production
  rendered_absent_keys: [sampling]
