# prompt-management §5 (proposal 0109): a backend sourcing Prompt.token_budget from
# a config that carries an UNRECOGNIZED key alongside valid bounds applies the
# recognized bounds and IGNORES the unknown key — token_budget has no extras mapping
# (unlike sampling), so a stray key is dropped, not carried. The unrecognized-key
# case is normatively convergent to apply-recognized-and-ignore, and a
# malformed/unrecognized token_budget config MUST NOT break the call (token_budget is
# advisory / observability-only, §3). The fetch succeeds and Prompt.token_budget
# carries only the recognized bound.
#
# Harness note (per conformance-adapter §3.2): the backend's `token_budget:` object
# is the RAW sourced config — it MAY carry keys beyond input_max_tokens /
# total_max_tokens; the backend parses it per §5, dropping unrecognized keys.

backends:
  - name: local
    prompts:
      - name: classify
        label: production
        version: v1
        template: "Classify: {{ topic }}"
        template_hash: "sha256:classify-v1"
        # Raw sourced config: a valid bound plus a stray, unrecognized key.
        token_budget:
          input_max_tokens: 10
          unknown: 5

manager:
  backends: [local]

calls:
  - target: manager
    operation: fetch
    name: classify
    label: production
    capture_as: prompt

expected:
  # The unrecognized `unknown` key is dropped; only the recognized bound is
  # applied. The fetch succeeds — the advisory config never breaks the call
  # (§5 / §3). token_budget carries exactly {input_max_tokens: 10}, no `unknown`.
  prompt:
    name: classify
    label: production
    version: v1
    token_budget:
      input_max_tokens: 10
