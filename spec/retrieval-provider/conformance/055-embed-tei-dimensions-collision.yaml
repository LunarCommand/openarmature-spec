# retrieval-provider §8.1 TEI /embed + llm-provider §6 clause (b) (inherited via
# §10) — the SAME-NAME declared-field realization `dimensions` on the TEI
# mapping.
#
# Fixture 052 pins this arm on §8.3 (OpenAI). It cannot cover TEI: a fixture is
# bound to one wire mapping by its `mapping:` key, and §6 clause (b) is realized
# independently by each §8.x mapping, so an implementation can wire the
# collision check into one mapping's pre-send path and not another's. §10 names
# `dimensions` → `dimensions` for BOTH §8.1 and §8.3; before proposal 0122
# neither mapping carried the enumeration §6 requires, and only §8.3 had a
# fixture.
#
# The no-op case additionally pins that the wire body stays MINIMAL: §8.1 omits
# `prompt_name` when `input_type` is absent, so a matching extras `dimensions`
# leaves the rest of the body unchanged.
#
# ---------------------------------------------------------------------
# Per-directory harness directives: see 017's header (mapping: tei,
# tei_embedding_provider, the /embed {inputs[, prompt_name][, dimensions]}
# request and bare-vector-array response, expected_wire_request_absent_keys),
# 034's header (the pre-send-reject convention: NO mock_embedding + NO
# expected_wire_request, the no_embed_request_issued invariant), 016's header
# (expected_error: {category, raised_from}), and 039's header
# (calls_embed.config.extras).

mapping: tei

tei_embedding_provider:
  base_url: "http://tei-embed.invalid"
  model: tei-embed-test
  input_type_prompt_map: {query: "query", document: "passage"}

cases:
  - name: conflicting_extras_dimensions_rejected_pre_send
    description: |
      embed(config={dimensions: 4, extras: {dimensions: 8}}) on the TEI mapping.
      The declared `dimensions` (4) is realized as TEI's wire `dimensions`; the
      extras `dimensions` (8) names that same managed wire key and CONFLICTS.
      Per §6 clause (b) the mapping MUST raise provider_invalid_request (§7) at
      pre-send validation and MUST NOT issue any /embed request. An
      implementation that implemented the check only in §8.3 passes fixture 052
      and fails here.
    state:
      fields:
        embedding_response:
          type: record
          default: null
    entry: embed_node
    nodes:
      embed_node:
        calls_embed:
          input: ["alpha string"]
          config:
            dimensions: 4
            extras:
              dimensions: 8
          stores_response_in: embedding_response
    edges:
      - {from: embed_node, to: END}
    initial_state: {}
    expected_error:
      category: provider_invalid_request
      raised_from: embed_node
    expected:
      invariants:
        declared_dimensions_conflict_rejected_pre_send: true
        no_embed_request_issued: true
        extras_dimensions_neither_dropped_nor_forwarded: true

  - name: matching_extras_dimensions_is_no_op
    description: |
      embed(config={dimensions: 4, extras: {dimensions: 4}}) on the TEI mapping.
      The extras value EQUALS the declared one, so it is a redundant no-op: the
      wire carries a single `dimensions: 4`, `prompt_name` stays absent because
      `input_type` is unset, and the call proceeds.
    state:
      fields:
        embedding_response:
          type: record
          default: null
    entry: embed_node
    nodes:
      embed_node:
        calls_embed:
          input: ["alpha string"]
          config:
            dimensions: 4
            extras:
              dimensions: 4
          stores_response_in: embedding_response
    edges:
      - {from: embed_node, to: END}
    initial_state: {}
    expected_wire_request:
      inputs: ["alpha string"]
      dimensions: 4
    expected_wire_request_absent_keys: [prompt_name]
    expected_wire_request_count: 1
    mock_embedding:
      - status: 200
        body:
          - [0.01, 0.02, 0.03, 0.04]
    expected:
      final_state:
        embedding_response:
          vectors_length: 1
          dimensions: 4
          inner_vector_lengths_all_equal: 4
          model: tei-embed-test
      invariants:
        matching_extras_dimensions_no_op: true
        wire_dimensions_is_declared_value_once: true
        wire_body_stays_minimal_prompt_name_absent: true
